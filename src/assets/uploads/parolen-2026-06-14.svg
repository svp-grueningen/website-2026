<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Abstimmungsparolen SVP Grüningen – 14. Juni 2026</title>

<!-- Background -->
<rect width="1200" height="630" fill="#C8102E"/>

<!-- White diagonal stripe accent (subtle SVP style) -->
<polygon points="900,0 1200,0 1200,630 1050,630" fill="#ffffff" opacity="0.05"/>

<!-- Left content area (white card) -->
<rect x="0" y="0" width="520" height="630" fill="white"/>

<!-- Red accent bar on left card -->
<rect x="0" y="0" width="8" height="630" fill="#C8102E"/>

<!-- SVP Grüningen label + date on red area -->
<text x="560" y="80" font-family="Arial Black, Arial, sans-serif" font-size="22" font-weight="900" fill="white" letter-spacing="2">SVP GRÜNINGEN</text>
<text x="560" y="120" font-family="Arial, sans-serif" font-size="52" font-weight="900" fill="white" letter-spacing="-1">14. Juni 2026</text>
<text x="560" y="158" font-family="Arial, sans-serif" font-size="20" fill="rgba(255,255,255,0.85)" letter-spacing="1">ABSTIMMUNGSPAROLEN</text>

<!-- Horizontal divider on red -->
<line x1="560" y1="175" x2="1160" y2="175" stroke="white" stroke-width="1.5" opacity="0.3"/>

<!-- EIDGENÖSSISCH label -->
<text x="560" y="210" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="rgba(255,255,255,0.7)" letter-spacing="3">EIDGENÖSSISCH</text>

<!-- Vorlage 1: Keine 10-Mio-Schweiz -->
<rect x="560" y="222" width="600" height="46" rx="6" fill="rgba(0,0,0,0.15)"/>
<text x="575" y="249" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="white">«Keine 10-Millionen-Schweiz!»</text>
<text x="575" y="262" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.75)">Nachhaltigkeitsinitiative</text>
<rect x="1070" y="228" width="72" height="34" rx="5" fill="#2d8a2d"/>
<text x="1106" y="250" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="16" font-weight="900" fill="white">JA</text>

<!-- Vorlage 2: ZDG -->
<rect x="560" y="276" width="600" height="46" rx="6" fill="rgba(0,0,0,0.1)"/>
<text x="575" y="303" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="white">Änderung Zivildienstgesetz (ZDG)</text>
<text x="575" y="316" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.75)">Zivildienstgesetz anpassen</text>
<rect x="1070" y="282" width="72" height="34" rx="5" fill="#2d8a2d"/>
<text x="1106" y="304" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="16" font-weight="900" fill="white">JA</text>

<!-- KANTONAL label -->
<text x="560" y="347" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="rgba(255,255,255,0.7)" letter-spacing="3">KANTONAL ZÜRICH</text>

<!-- Vorlage 3: Verfassungsänderung -->
<rect x="560" y="358" width="600" height="40" rx="5" fill="rgba(0,0,0,0.15)"/>
<text x="575" y="381" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="white">Verfassungsänderung Kantonsratsmitglieder</text>
<rect x="1056" y="363" width="88" height="28" rx="4" fill="rgba(255,255,255,0.2)"/>
<text x="1100" y="381" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="13" font-weight="900" fill="white">NEIN</text>

<!-- Vorlage 4: Wohneigentums-Initiative -->
<rect x="560" y="404" width="600" height="40" rx="5" fill="rgba(0,0,0,0.1)"/>
<text x="575" y="428" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="white">Wohneigentums-Initiative</text>
<rect x="1070" y="409" width="72" height="28" rx="4" fill="#2d8a2d"/>
<text x="1106" y="428" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="13" font-weight="900" fill="white">JA</text>

<!-- Vorlage 5: Wohnungsinitiative -->
<rect x="560" y="450" width="600" height="40" rx="5" fill="rgba(0,0,0,0.15)"/>
<text x="575" y="468" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="white">Wohnungsinitiative (A) / Gegenvorschlag (B)</text>
<text x="575" y="482" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.7)">NEIN zur Initiative / JA zum Gegenvorschlag</text>
<rect x="1044" y="455" width="100" height="28" rx="4" fill="rgba(255,255,255,0.2)"/>
<text x="1094" y="474" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="11" font-weight="900" fill="white">NEIN / JA</text>

<!-- Vorlage 6: Wohnschutz-Initiative -->
<rect x="560" y="496" width="600" height="40" rx="5" fill="rgba(0,0,0,0.1)"/>
<text x="575" y="514" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="white">Wohnschutz-Initiative (A) / Gegenvorschlag (B)</text>
<text x="575" y="528" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.7)">NEIN zur Initiative / JA zum Gegenvorschlag</text>
<rect x="1044" y="501" width="100" height="28" rx="4" fill="rgba(255,255,255,0.2)"/>
<text x="1094" y="520" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="11" font-weight="900" fill="white">NEIN / JA</text>

<!-- Vorlage 7: Stopp Prämien-Schock -->
<rect x="560" y="542" width="600" height="40" rx="5" fill="rgba(0,0,0,0.15)"/>
<text x="575" y="566" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="white">Stopp Prämien-Schock Initiative</text>
<rect x="1070" y="547" width="72" height="28" rx="4" fill="#2d8a2d"/>
<text x="1106" y="566" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="13" font-weight="900" fill="white">JA</text>

<!-- Bottom bar -->
<rect x="560" y="595" width="640" height="35" fill="rgba(0,0,0,0.2)"/>
<text x="1150" y="617" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.7)">svp-grueningen.ch</text>

<!-- LEFT CARD CONTENT -->
<!-- Big JA count -->
<text x="40" y="120" font-family="Arial Black, Arial, sans-serif" font-size="110" font-weight="900" fill="#C8102E" opacity="0.08">5×JA</text>

<!-- Main message -->
<text x="40" y="130" font-family="Arial Black, Arial, sans-serif" font-size="68" font-weight="900" fill="#C8102E" letter-spacing="-2">5× JA</text>
<text x="40" y="185" font-family="Arial Black, Arial, sans-serif" font-size="68" font-weight="900" fill="#1a1a1a" letter-spacing="-2">2× NEIN</text>

<line x1="40" y1="210" x2="480" y2="210" stroke="#C8102E" stroke-width="3"/>

<text x="40" y="248" font-family="Arial, sans-serif" font-size="19" fill="#333333" font-weight="700">Für die Schweiz.</text>
<text x="40" y="275" font-family="Arial, sans-serif" font-size="19" fill="#333333" font-weight="700">Für Grüningen.</text>

<!-- Key JA initiatives highlighted -->
<rect x="40" y="305" width="460" height="52" rx="8" fill="#f5f5f5"/>
<rect x="40" y="305" width="5" height="52" rx="2" fill="#2d8a2d"/>
<text x="60" y="328" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">Keine 10-Millionen-Schweiz!</text>
<text x="60" y="346" font-family="Arial, sans-serif" font-size="11" fill="#555">Zuwanderung begrenzen – Schweizer Werte schützen</text>

<rect x="40" y="365" width="460" height="52" rx="8" fill="#f5f5f5"/>
<rect x="40" y="365" width="5" height="52" rx="2" fill="#2d8a2d"/>
<text x="60" y="388" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">Wohneigentums-Initiative</text>
<text x="60" y="406" font-family="Arial, sans-serif" font-size="11" fill="#555">Wohneigentum wieder für alle ermöglichen</text>

<rect x="40" y="425" width="460" height="52" rx="8" fill="#f5f5f5"/>
<rect x="40" y="425" width="5" height="52" rx="2" fill="#2d8a2d"/>
<text x="60" y="448" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">Stopp Prämien-Schock Initiative</text>
<text x="60" y="466" font-family="Arial, sans-serif" font-size="11" fill="#555">Entlastung bei Krankenkassenprämien</text>

<!-- Bottom of left card -->
<rect x="0" y="545" width="520" height="85" fill="#C8102E"/>
<text x="40" y="580" font-family="Arial Black, Arial, sans-serif" font-size="18" font-weight="900" fill="white">SVP GRÜNINGEN</text>
<text x="40" y="604" font-family="Arial, sans-serif" font-size="13" fill="rgba(255,255,255,0.85)">Für Grüningen, für die Schweiz</text>

</svg>
